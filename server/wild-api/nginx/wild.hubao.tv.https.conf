limit_req_zone $binary_remote_addr zone=wild_guard_api_ip:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=wild_guard_api_conn:10m;

server {
    listen 80;
    listen [::]:80;
    server_name wild.hubao.tv;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name wild.hubao.tv;

    ssl_certificate /etc/letsencrypt/live/wild.hubao.tv/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wild.hubao.tv/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    location ^~ /assets/ {
        root /var/lib/wild-guard-api;
        try_files $uri =404;
        limit_except GET HEAD { deny all; }
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    location / {
        limit_req zone=wild_guard_api_ip burst=40 nodelay;
        limit_req_status 429;
        limit_conn wild_guard_api_conn 20;
        proxy_pass http://127.0.0.1:3117;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        client_max_body_size 96k;
    }
}
